<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bosque ASCII</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);cursor:crosshair;touch-action:none}
  /* controles na tela: barra de golpes (PC e celular), botões de ação, joystick (só celular) */
  #ui{position:fixed;inset:0;pointer-events:none;font:13px/1.15 "Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;color:#eee;display:none}
  #ui.on{display:block}
  #ui .b{pointer-events:auto;background:rgba(8,12,8,.78);border:1px solid rgba(160,220,160,.55);border-radius:7px;color:#eee;
    padding:5px 8px;text-align:center;touch-action:none;cursor:pointer;white-space:nowrap}
  #ui .b.off{opacity:.38} #ui .b.sel{outline:2px solid #ffe070;outline-offset:1px}
  #bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px}
  #bar .mv{min-width:118px;position:relative;overflow:hidden}
  #bar .mv i{position:absolute;left:0;bottom:0;height:3px;background:#ffe070}
  #bar .mv small{display:block;opacity:.75;font-size:11px}
  #acts{position:absolute;right:8px;top:26px;display:flex;flex-direction:row;gap:6px;align-items:flex-start}
  #send{font-weight:bold;border-color:#ff8a70 !important}
  #joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;border:2px solid rgba(200,255,200,.35);
    background:rgba(0,0,0,.2);display:none;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(200,255,200,.35)}
  body.touch #joy{display:block}
  body.touch #bar{left:auto;right:10px;bottom:12px;transform:none;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  body.touch #bar .mv{min-width:104px;padding:9px 6px;font-size:13px}
  body.touch #acts{right:10px;top:auto;bottom:118px;display:grid;grid-template-columns:auto auto;gap:6px}
  body.touch #acts .b{padding:9px 10px;font-size:13px}
  #run{display:none} body.touch #run{display:block}
  /* time: 6 lugares à esquerda (bicho ou vazio); clicar/tocar troca quem luta */
  #menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;z-index:24;max-height:94vh;max-width:97vw;overflow:auto}
  #menu .mp{font-family:ui-monospace,Consolas,monospace;line-height:1.38;color:#ecebd8;background:rgba(6,10,6,.92);border:1px solid rgba(170,220,160,.65);
    border-radius:8px;padding:.55em 1.1em;box-shadow:0 4px 18px rgba(0,0,0,.55);text-align:center;white-space:pre;margin:.35em auto;user-select:none;width:max-content}
  #menu .tt{color:#ffe08c;margin-bottom:.15em} #menu .em{height:.55em}
  #menu .opt{color:#fff3b0;cursor:pointer;border-radius:4px} #menu .opt:hover{background:rgba(255,240,160,.15)}
  #dlg{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:min(92vw,40em);display:none;z-index:25;box-sizing:border-box;
    font:clamp(15px,calc(.75vw + 9px),21px)/1.45 ui-monospace,Consolas,monospace;color:#f2f2e2;background:rgba(6,10,6,.9);
    border:1px solid rgba(170,220,160,.65);border-radius:8px;padding:.6em .9em .8em;box-shadow:0 4px 18px rgba(0,0,0,.55);cursor:pointer;user-select:none}
  #dlg .who{color:#ffe08c;margin-bottom:.2em} #dlg .txt{min-height:2.9em;white-space:pre-wrap}
  #dlg .ch>div{color:#fff0a0;padding:.25em .5em;border-radius:5px;margin-top:.25em;border:1px solid rgba(255,240,160,.25)}
  #dlg .ch>div:hover{background:rgba(255,240,160,.15)}
  #dlg .more{position:absolute;right:.8em;bottom:.25em;color:#fff0a0;font-size:.8em;animation:dlgb .5s infinite alternate}
  @keyframes dlgb{to{transform:translateY(3px)}}
  body.touch #dlg{bottom:auto;top:30%;width:94vw}
  #nick{position:absolute;left:50%;top:38%;transform:translateX(-50%);display:none;z-index:30;font:18px monospace;padding:8px 12px;
    width:12em;background:#0c140c;color:#fff6d0;border:1px solid #ffe070;border-radius:6px;outline:none}
  #party{position:absolute;left:8px;top:18%;display:flex;flex-direction:column;gap:4px;width:15.5em}
  #party .pm{pointer-events:auto;background:rgba(8,12,8,.72);border:1px solid rgba(160,220,160,.4);border-radius:6px;padding:.3em .5em;cursor:pointer}
  #party .pm.cur{border-color:#ffe070} #party .pm.ko{opacity:.55;border-color:#a55} #party .pm.vazio{opacity:.35;cursor:default;border-style:dashed}
  #party .pm .t{display:flex;justify-content:space-between;gap:.4em;white-space:nowrap} #party .pm b{font-weight:normal;overflow:hidden;text-overflow:ellipsis}
  #party .pm small{opacity:.8;white-space:nowrap}
  #party .hp{height:4px;background:#333;border-radius:2px;margin-top:3px;overflow:hidden} #party .hp i{display:block;height:100%}
  body.touch #party{top:auto;bottom:calc(50% - 60px);width:9.5em;font-size:11px;gap:3px}
  @media (max-height:430px){ body.touch #party{bottom:auto;top:96px;display:grid;grid-template-columns:1fr 1fr;width:19em;font-size:10px} }
  /* PC: cada botão mostra a tecla de atalho; janela estreita quebra a fileira em vez de cortar */
  body:not(.touch) #acts{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 16px)}
  body:not(.touch) #acts .b[data-sc]::before{content:attr(data-sc);display:inline-block;margin-right:.45em;padding:0 .35em;border:1px solid rgba(255,230,140,.7);
    border-radius:4px;color:#ffe08a;font-size:.85em}
  /* celular: Lançar/Voltar (e Posto, quando perto) ficam à mão; o resto abre no botão Menu */
  #menub{display:none} body.touch #menub{display:block}
  body.touch #acts .b.m{display:none} body.touch #acts.open .b.m{display:block}
  body.touch #acts.open #menub{border-color:#ffe070}
  /* PC: lista de golpes à direita, logo acima da lista do time (posição e tamanho calculados pela grade) */
  body:not(.touch) #bar{left:auto;transform:none;flex-direction:column;gap:4px}
  body:not(.touch) #bar .mv{display:flex;align-items:baseline;gap:.6em;text-align:left;min-width:0;padding:.35em .6em}
  body:not(.touch) #bar .mv small{display:inline;margin-left:auto;font-size:.8em}
  /* celular em pé: joystick menor e botões mais estreitos, para nada se sobrepor */
  @media (max-width:520px){
    #joy{width:112px;height:112px;left:14px;bottom:16px} #knob{left:33px;top:33px;width:46px;height:46px}
    body.touch #bar{right:8px;bottom:12px;gap:6px} body.touch #bar .mv{min-width:88px;padding:8px 4px;font-size:12px}
    body.touch #acts{right:6px;bottom:116px;grid-template-columns:auto;gap:5px} body.touch #acts .b{padding:7px 6px;font-size:11px;min-width:62px}
  }
</style>

    <div class="b m" data-k="KeyC" data-sc="C">Bola</div>

    <div class="b m" data-k="KeyM" data-sc="M">Mapa</div>
    <div class="b m" data-k="KeyJ" data-sc="J">Diário</div>
    <div class="b m" id="run">Correr</div>
    <div class="b m" data-k="Minus" data-sc="−" title="letras menores (mais detalhe)">A−</div>
    <div class="b m" data-k="Equal" data-sc="+" title="letras maiores (mais leve)">A+</div>
  </div>
  <div id="joy"><div id="knob"></div></div>
</div>

// ---------- utilidades ----------
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hash3(x, y, z) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1440662683)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function mulberry32(s) {
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- mundo infinito: quadras montadas e desmontadas em volta do jogador ----------
// A grade é uma janela N×N que anda com o jogador: a quadra do mundo (I, J) mora no slot (I & NM1, J & NM1).
// Cada quadra nasce só das suas coordenadas (semente própria), então desmontar é sobrescrever o slot e, quando
// ela volta para perto, sai igual. O que muda no mundo fica guardado por ID em WORLD — só as diferenças.
// primitiva: [tipo, cx, cy, cz, rx, ry, rz, material, semente]
// tipo 0 = cilindro vertical (cy = base, ry = topo, rx = raio); tipo 1 = elipsoide
const N = 64, NM1 = N - 1, S = 6, MAXP = 6, PS = 9, CSTR = MAXP * PS, MAXO = 8;
const VIEW_R = 26;                     // raio da janela em quadras (< N/2; a visão alcança ~15)
const PERIOD = 768;                    // a trilha se repete a cada PERIOD ao longo de z
const SPAWN_Z = PERIOD * 0.3;
const prims = new Float32Array(N * N * CSTR);
const pcount = new Uint8Array(N * N);
const pobj = new Uint8Array(N * N * MAXP);                 // objeto da quadra a que cada primitiva pertence
const ocount = new Uint8Array(N * N), okind = new Uint8Array(N * N * MAXO);
const ctype = new Uint8Array(N * N);   // 0 floresta, 1 trilha, 2 clareira
const zone = new Float32Array(N * N);  // tendência a pinheiros
const tagI = new Int32Array(N * N).fill(-2147483648), tagJ = new Int32Array(N * N);   // que quadra ocupa o slot

// ID de objeto = quadra + número do objeto dentro dela; cabe folgado num número de 53 bits
const OBJ_KINDS = ['', 'carvalho', 'pinheiro', 'bétula', 'arbusto', 'pedra', 'toco', 'tronco caído', 'árvore morta', 'cogumelo'];
const K_OAK = 1, K_PINE = 2, K_BIRCH = 3, K_BUSH = 4, K_ROCK = 5, K_STUMP = 6, K_LOG = 7, K_DEAD = 8, K_MUSH = 9;
const objId = (I, J, n) => ((I + 524288) * 1048576 + (J + 524288)) * MAXO + n;
function objCell(id) {
  const n = id % MAXO, q = (id - n) / MAXO;
  return { I: Math.floor(q / 1048576) - 524288, J: q % 1048576 - 524288, n };
}
const WORLD = { removed: new Set(), built: 0 };            // diferenças por ID + quantas quadras já foram montadas

let gCell = 0, gI = 0, gJ = 0, gObj = 0, gSkip = false;   // quadra sendo montada agora
function beginObj(kind) {
  gObj = ocount[gCell];
  if (gObj < MAXO) { okind[gCell * MAXO + gObj] = kind; ocount[gCell] = gObj + 1; }
  gSkip = WORLD.removed.has(objId(gI, gJ, gObj));          // tirado do mapa: o sorteio segue igual, só não entra
}
function addPrim(cell, kind, cx, cy, cz, rx, ry, rz, mat, seed) {
  const k = pcount[cell]; if (k >= MAXP || gSkip) return;
  const o = cell * CSTR + k * PS;
  prims[o] = kind; prims[o + 1] = cx; prims[o + 2] = cy; prims[o + 3] = cz;
  prims[o + 4] = rx; prims[o + 5] = ry; prims[o + 6] = rz; prims[o + 7] = mat; prims[o + 8] = seed;
  pobj[cell * MAXP + k] = gObj;
  pcount[cell] = k + 1;
}
const cyl = (cell, cx, cz, r, y0, y1, mat, seed) => addPrim(cell, 0, cx, y0, cz, r, y1, r, mat, seed);
const ell = (cell, cx, cy, cz, rx, ry, rz, mat, seed) => addPrim(cell, 1, cx, cy, cz, rx, ry, rz, mat, seed);

function pathX(z) { const a = z / PERIOD * TAU; return PERIOD * 0.5 + 34 * Math.sin(a * 2) + 12 * Math.sin(a * 5 + 1.3); }
function pathSlope(z) { const a = z / PERIOD * TAU, k = TAU / PERIOD; return 68 * k * Math.cos(a * 2) + 60 * k * Math.cos(a * 5 + 1.3); }
// o Leste (bichos de Johto): uma segunda trilha 1600 m a leste, ligada à primeira por 5 estradas
const EAST_DX = 1600, EAST_X0 = PERIOD * 0.5 + EAST_DX;
function pathX2(z) { const a = z / PERIOD * TAU; return EAST_X0 + 30 * Math.sin(a * 3 + 0.7) + 10 * Math.sin(a * 7 + 2); }
function pathSlope2(z) { const a = z / PERIOD * TAU, k = TAU / PERIOD; return 90 * k * Math.cos(a * 3 + 0.7) + 70 * k * Math.cos(a * 7 + 2); }
// ligações (por distância na trilha): 600 aberta, 1900 pedras (Strength), 3300 rio (Surf), 4600 lagoa (Dive), 6000 aberta
const LINK_DZ = [600, 1900, 3300, 4600, 6000], LINK_KIND = ['aberta', 'pedras', 'rio', 'lagoa', 'aberta'];
const linkZ = (i, x) => SPAWN_Z + LINK_DZ[i] + 7 * Math.sin(x * 0.013 + i * 1.7);
const isEast = (x, z) => x > (pathX(z) + pathX2(z)) / 2;
function pathDist(x, z) {
  let d = Math.abs(x - pathX(z)) / Math.sqrt(1 + pathSlope(z) ** 2);
  if (Math.abs(x - EAST_X0) < 80) { const s = pathSlope2(z); d = Math.min(d, Math.abs(x - pathX2(z)) / Math.sqrt(1 + s * s)); }
  if (x > PERIOD * 0.5 && x < EAST_X0 + 40) for (let i = 0; i < 5; i++) {
    const dz = Math.abs(z - SPAWN_Z - LINK_DZ[i]); if (dz > 30) continue;
    const zc = linkZ(i, x); if (x > pathX(zc) && x < pathX2(zc)) d = Math.min(d, Math.abs(z - zc));
  }
  return d;
}
// rio largo que corta a ligação de 3300 m (atravessa com Surf) e lagoa funda na de 4600 m (só mergulhando)
const RIVER_X = (pathX(SPAWN_Z + 3300) + pathX2(SPAWN_Z + 3300)) / 2;
const riverAt = (x, z) => Math.abs(z - SPAWN_Z - 3300) < 260 && Math.abs(x - RIVER_X - 9 * Math.sin(z * 0.02)) < 13;
const LAGOA = { x: (pathX(SPAWN_Z + 4600) + pathX2(SPAWN_Z + 4600)) / 2, z: SPAWN_Z + 4600, rx: 170, rz: 110 };
const lagoaAt = (x, z) => ((x - LAGOA.x) / LAGOA.rx) ** 2 + ((z - LAGOA.z) / LAGOA.rz) ** 2 < 1;
const whirlAt = (x, z) => ((x - LAGOA.x) / (LAGOA.rx - 25)) ** 2 + ((z - LAGOA.z) / (LAGOA.rz - 25)) ** 2 < 1;   // redemoinhos no meio
// clareiras: a do início é fixa; as outras saem de um sorteio por região de REG×REG (cerca de 1 em cada 4)
const REG = 120, CLEAR = [[pathX(SPAWN_Z + 18) + 9, SPAWN_Z + 18, 11]];
function clearFactor(x, z) {
  let m = 9;
  const test = (cx, cz, r) => { const f = Math.hypot(x - cx, z - cz) / r; if (f < m) m = f; };
  for (const c of CLEAR) test(c[0], c[1], c[2]);
  const ri = Math.floor(x / REG), rj = Math.floor(z / REG);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    const I = ri + a, J = rj + b;
    if (hash2(I * 3 + 11, J * 7 + 5) < 0.75) continue;
    test((I + 0.2 + 0.6 * hash2(I, J + 17)) * REG, (J + 0.2 + 0.6 * hash2(I + 31, J)) * REG, 7 + 8 * hash2(I + 5, J + 9));
  }
  return m;
}

// Todas as peças ficam dentro da própria quadra (meia largura = 3), o que deixa o DDA parar cedo.
function oak(cell, R) {
  beginObj(K_OAK);
  const lx = S / 2 + (R() - 0.5) * 1.6, lz = S / 2 + (R() - 0.5) * 1.6, sd = R();
  const tr = 0.3 + R() * 0.15, th = 3.4 + R() * 1.4, cr = 1.7 + R() * 0.4, cry = 1.3 + R() * 0.35;
  cyl(cell, lx, lz, tr, 0, th + 0.5, BARK, sd);
  ell(cell, lx, th + 0.7, lz, cr, cry, cr, OAKLEAF, sd);
  const a = R() * TAU;
  ell(cell, lx + Math.cos(a) * 0.95, th - 0.15, lz + Math.sin(a) * 0.95, 1.1, 0.95, 1.1, OAKLEAF, sd);
  ell(cell, lx + Math.cos(a + 2.5) * 0.9, th + 0.05, lz + Math.sin(a + 2.5) * 0.9, 1.0, 0.9, 1.0, OAKLEAF, sd);
  if (R() < 0.45) mushroom(cell, R, lx, lz, tr);
}
function mushroom(cell, R, lx, lz, tr) {
  beginObj(K_MUSH);
  const b = R() * TAU, dd = tr + 0.3 + R() * 0.25, mx = lx + Math.cos(b) * dd, mz = lz + Math.sin(b) * dd;
  cyl(cell, mx, mz, 0.05, 0, 0.2, STEM, 0);
  ell(cell, mx, 0.22, mz, 0.17, 0.09, 0.17, R() < 0.4 ? GLOWSHROOM : MUSH, R());
}
function pine(cell, R) {
  beginObj(K_PINE);
  const lx = S / 2 + (R() - 0.5) * 1.2, lz = S / 2 + (R() - 0.5) * 1.2, sd = R();
  const h = 7 + R() * 3.5, r0 = 1.9 + R() * 0.4;
  cyl(cell, lx, lz, 0.22 + R() * 0.08, 0, h - 0.6, PINEBARK, sd);
  for (let k = 0; k < 4; k++) {
    const f = k / 3, rr = r0 * (1 - f * 0.68);
    ell(cell, lx, 2.7 + f * (h - 3.9), lz, rr, 1.05 - f * 0.25, rr, PINELEAF, sd);
  }
  ell(cell, lx, h - 0.6, lz, 0.38, 0.9, 0.38, PINELEAF, sd);
}
function birch(cell, R) {
  beginObj(K_BIRCH);
  const lx = S / 2 + (R() - 0.5) * 1.6, lz = S / 2 + (R() - 0.5) * 1.6, sd = R();
  const h = 6 + R() * 2.2, a = R() * TAU;
  cyl(cell, lx, lz, 0.16 + R() * 0.05, 0, h, BIRCH, sd);
  ell(cell, lx + Math.cos(a) * 0.5, h - 0.2, lz + Math.sin(a) * 0.5, 1.25, 1.6, 1.25, BIRCHLEAF, sd);
  ell(cell, lx - Math.cos(a) * 0.55, h - 1.6, lz - Math.sin(a) * 0.55, 1.05, 1.2, 1.05, BIRCHLEAF, sd);
  ell(cell, lx + Math.cos(a + 1.6) * 0.6, h - 2.6, lz + Math.sin(a + 1.6) * 0.6, 0.85, 0.95, 0.85, BIRCHLEAF, sd);
}
function bush(cell, R, x, z, sc) {
  beginObj(K_BUSH);
  const n = 2 + ((R() * 2) | 0), sd = R();
  for (let k = 0; k < n; k++) {
    const a = R() * TAU, d = R() * 0.6 * sc, r = (0.7 + R() * 0.4) * sc;
    ell(cell, x + Math.cos(a) * d, 0.35 * sc + R() * 0.15, z + Math.sin(a) * d, r, r * 0.75, r, BUSH, sd);
  }
}
function rock(cell, R, x, z, sc) {
  beginObj(K_ROCK);
  const sd = R();
  ell(cell, x, -0.1, z, (0.7 + R() * 0.8) * sc, (0.45 + R() * 0.45) * sc, (0.6 + R() * 0.7) * sc, ROCK, sd);
  if (R() < 0.4) ell(cell, x + 0.9 * sc, -0.05, z + (R() - 0.5) * sc, 0.45 * sc, 0.35 * sc, 0.4 * sc, ROCK, R());
}
function stump(cell, R) {
  beginObj(K_STUMP);
  const lx = S / 2 + (R() - 0.5) * 2, lz = S / 2 + (R() - 0.5) * 2, r = 0.4 + R() * 0.15;
  cyl(cell, lx, lz, r, 0, 0.45 + R() * 0.3, BARK, R());
  if (R() < 0.5) mushroom(cell, R, lx, lz, r);
}
function fallenLog(cell, R) {
  beginObj(K_LOG);
  const c = S / 2, len = 2.0 + R() * 0.6, sd = R();
  if (R() < 0.5) ell(cell, c, 0.3, c, len, 0.33, 0.33, LOG, sd);
  else ell(cell, c, 0.3, c, 0.33, 0.33, len, LOG, sd);
}
function deadTree(cell, R) {
  beginObj(K_DEAD);
  const lx = S / 2 + (R() - 0.5) * 2, lz = S / 2 + (R() - 0.5) * 2;
  cyl(cell, lx, lz, 0.22 + R() * 0.08, 0, 4 + R() * 2.5, DEADWOOD, R());
}

// monta a quadra (I, J) no seu slot; só depende de I, J e das diferenças guardadas em WORLD
// nível dos selvagens: Kanto cresce com a distância do começo; o Leste tem curva própria (ginásios no meio dos de Kanto)
const LV_E = [[0, 6], [500, 12], [1150, 21], [1800, 31], [2500, 42], [3200, 52], [3950, 62], [4800, 75], [5700, 86], [6500, 92], [9000, 100]];
function levelAt(x, z) {
  if (!isEast(x, z)) return 2 + Math.hypot(x - pathX(SPAWN_Z), z - SPAWN_Z) / 60;
  const dz = Math.max(0, z - SPAWN_Z); let k = 1; while (k < LV_E.length - 1 && LV_E[k][0] < dz) k++;
  const [a0, l0] = LV_E[k - 1], [a1, l1] = LV_E[k], f = Math.min(1, Math.max(0, (dz - a0) / (a1 - a0)));
  return l0 + (l1 - l0) * f + Math.abs(x - pathX2(z)) / 150;
}
// lagos: manchas de ruído bem largas, longe do começo e das vilas; a trilha sempre passa (aterro)
function waterAt(x, z) {
  if (x > INT_X0 - 300) return false;
  if (riverAt(x, z) || lagoaAt(x, z)) return true;
  if (legendWater(x, z)) return true;                 // lago da Caverna Sem Nome
  if (legendDry(x, z)) return false;                  // anéis dos lugares lendários ficam secos
  if (vnoise(x * 0.011 + 71.3, z * 0.011 - 12.7) < 0.7) return false;

// Contorno: onde a profundidade salta, o caractere vira - / | \ conforme o ângulo da borda.
function contours() {

// Brilho depois da conversão: emissivos borrados e somados por cima da grade pronta.
function blurCh(A) {

// ---------- jogador ----------
const pl = { x: pathX(SPAWN_Z), z: SPAWN_Z, yaw: Math.atan2(pathSlope(SPAWN_Z), 1), pitch: 0.1, vx: 0, vz: 0, step: 0, bob: 0 };

    const I = ci0 + a, J = cj0 + b, cell = (I & NM1) * N + (J & NM1), cnt = pcount[cell];
    if (!cnt) continue;
    const bx = I * S, bz = J * S; let o = cell * CSTR;
    for (let k = 0; k < cnt; k++, o += PS) {
      const m = prims[o + 7], cx = bx + prims[o + 1], cz = bz + prims[o + 3];
      const dx = e.x - cx, dz = e.z - cz;
      if (prims[o] === 0) {
        if (prims[o + 4] < 0.1) continue;                         // talo de cogumelo: atravessa
        const rad = prims[o + 4] + pad + (branches && m === PINEBARK ? 0.9 : 0);  // pinheiro: galhos baixos
        const d2 = dx * dx + dz * dz;
        if (d2 < rad * rad && d2 > 1e-8) { const s = rad / Math.sqrt(d2); e.x = cx + dx * s; e.z = cz + dz * s; }

function updatePlayer(dt) {

function updateMe(dt) {

function updateParticles(dt) {

  for (const b of BEAMS) {                            // clarões e raios dos golpes

// projeta partículas do mundo na grade, escondendo as que estão atrás de algo
function particles(ox, oy, oz, rx, rz, ux, uy, uz, fx, fy, fz) {
  const P = PAL;

    const vx = x - ox, vy = y - oy, vz = z - oz;
    const zc = vx * fx + vy * fy + vz * fz; if (zc < 0.2) return;
    const X = vx * rx + vz * rz, Y = vx * ux + vy * uy + vz * uz;
    const cx = Math.floor((Wd / 2 + X * focal / zc) / cw), cy = Math.floor((Hd / 2 - Y * focal / zc) / chh);
    if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return;

    if (dist > DEP[i]) return;

      const b = BALLS[k], red = b.state !== 'shake' || Math.sin(TIME * 20) > 0;   // (também a bola do bicho sendo lançado)
      CH[i] = dist < 6 ? C_O : C_o; FR[i] = 1; FG[i] = red ? 0.25 : 1; FB[i] = red ? 0.25 : 1;
      ER[i] += 0.4; EG[i] += red ? 0.1 : 0.4; EB[i] += red ? 0.1 : 0.4; emAny = true;
    } else if (kind === 3) {   // efeito de golpe: brilha e some
      const b = Math.min(1, FXL[k] / FXM[k] * 1.6) * fo;
      CH[i] = FXC[k];
      FR[i] = FXR[k] * b + FR[i] * (1 - b); FG[i] = FXGc[k] * b + FG[i] * (1 - b); FB[i] = FXB[k] * b + FB[i] * (1 - b);
      ER[i] += FXR[k] * b * 0.7; EG[i] += FXGc[k] * b * 0.7; EB[i] += FXB[k] * b * 0.7; emAny = true;
    } else if (kind === 2) {   // fagulha: amarela ao nascer, vermelha ao apagar

// leva o golpe até o alvo conforme o visual: projétil voa, raio é instantâneo, corpo avança, onda pega em volta…

  const v = c.mon.v, from = mouth(c), col = mv.col;
  const reach = t => Math.hypot(t.x - c.x, t.z - c.z) - (t.sp.R * t.scale + c.sp.R * c.scale) * 0.55;
  const foes = () => ACTIVE.filter(o => isFoe(c, o));
  const selfOnly = mv.cat === 'S' && !mv.foe;
  if (mv.f.haze) { weatherFX(center(c), col, [2, 6]); for (const o of ACTIVE) if (o.mon) o.mon.v.stage.fill(0); say('Todos os atributos voltaram ao normal!'); return; }
  if (selfOnly) { auraFX(c, col); resolve(c, c, mv); return; }
  if (mv.f.selfko && ACTIVE.some(o => o.mon && o.mon.hp > 0 && ab(o.mon, 'Damp') && Math.hypot(o.x - c.x, o.z - c.z) < 10)) { say('Damp impediu a explosão!'); return; }

    burst(center(c), col, 120, 5, [4, 5, 0, 8], 0.8, 2); lightFX(center(c), col, 0.6, 7); CAM.shake = 0.5;
    for (const o of foes()) if (Math.hypot(o.x - c.x, o.z - c.z) < 4 + c.scale) resolve(c, o, mv);
    c.mon.hp = 0; faint(c); return;
  }
  const kind = mv.vis;
  if (kind === 'onda') {
    ringFX(center(c), 3.5, col, [6, 0, 2]);
    if (mv.name === 'Earthquake' || mv.name === 'Fissure' || mv.name === 'Stomp') CAM.shake = 0.4;
    const R = 3.5 + c.sp.R * c.scale;
    let any = false;
    for (const o of foes()) if (Math.hypot(o.x - c.x, o.z - c.z) < R) { any = true; resolve(c, o, mv); }
    if (!any && c === ME) say('Não acertou ninguém.', 0);
    return;
  }
  if (!tgt) {                                         // sem alvo: o golpe sai para a frente mesmo assim
    const p = [from[0] + Math.sin(pl.yaw) * 6, from[1], from[2] + Math.cos(pl.yaw) * 6];
    if (kind === 'raio') beamFX(from, p, col, [0, 1, 11]);
    else if (kind === 'proj') PROJ.push({ c, mv, tgt: null, x: from[0], y: from[1], z: from[2], vx: Math.sin(pl.yaw) * 10, vy: 0, vz: Math.cos(pl.yaw) * 10, t: 0 });

    if (kind === 'corpo') { c.dash = { t: 0, x0: c.x, z0: c.z, x1: c.x + Math.sin(c.yaw) * 1.2, z1: c.z + Math.cos(c.yaw) * 1.2 }; }
    return;
  }
  const to = center(tgt), dist = Math.hypot(tgt.x - c.x, tgt.z - c.z);
  if (kind === 'corpo') {
    if (reach(tgt) > 4.0) {                          // longe: avança um pouco e erra
      c.dash = { t: 0, x0: c.x, z0: c.z, x1: c.x + Math.sin(c.yaw) * 1.2, z1: c.z + Math.cos(c.yaw) * 1.2 };

    c.dash = { t: 0, x0: c.x, z0: c.z, x1: c.x + (tgt.x - c.x) * k, z1: c.z + (tgt.z - c.z) * k, hit: { tgt, mv } };
    return;
  }
  if (kind === 'proj') {
    if (dist > 16) { if (c === ME) say('Longe demais!', 0); return; }
    const sp = 11, dx = to[0] - from[0], dy = to[1] - from[1], dz = to[2] - from[2], l = Math.hypot(dx, dy, dz) || 1;

    for (let i = 0; i < n; i++) PROJ.push({ c, mv, tgt, x: from[0], y: from[1], z: from[2], vx: dx / l * sp, vy: dy / l * sp, vz: dz / l * sp, t: -i * 0.09, main: i === 0 });
    return;
  }

    if (dist > 14) { if (c === ME) say('Longe demais!', 0); return; }
    if (kind === 'raio') { beamFX(from, to, col, mv.tn === 'Elétrico' ? [11, 12, 13, 0] : [0, 1, 6]); lightFX(to, col, 0.35, 4); }

    if (dist > 14) { if (c === ME) say('Longe demais!', 0); return; }
    burst(to, col, 90, 3.5, [4, 0, 5, 8], 0.7, 1.5); lightFX(to, col, 0.5, 6); CAM.shake = 0.3;
    resolve(c, tgt, mv); return;
  }
  if (kind === 'clima') {

  }

}

function useItem(name) {

  if (STONES.includes(name)) { useStone(name); return; }
  if (it.tm != null) { TEACH = { name, id: it.tm, mon: null }; return; }
  if (it.rod != null) { fish(it.rod); return; }
  if (it.finder) { useFinder(); return; }
  if (it.story) { say(`${name}: ${it.d}.`, 2); return; }
  if (it.bike) { toggleBike(); return; }
  if (it.rope) { escapeRope(name); return; }
  if (it.repel) { BAG[name]--; REPEL_UNTIL = TIME + it.repel; say(`Usou ${name}: selvagens mais fracos que ${spName(m)} não vão atacar.`, 2); return; }

    BAG[name]--; if (m.item) BAG[m.item] = (BAG[m.item] || 0) + 1;
    say(`${spName(m)} agora segura ${name}${m.item ? ` (${m.item} voltou para a mochila)` : ''}.`, 2); m.item = name; return;
  }
  if (TIME < m.v.cd && !it.revive) { say('Espere um instante para usar o item.', 0); return; }
  const spend = () => { BAG[name]--; m.v.cd = Math.max(m.v.cd, TIME + 0.8); };
  if (it.revive) {
    const t = PARTY.find(q => q.hp <= 0);
    if (!t) { say('Ninguém desmaiado no time.'); return; }
    t.hp = Math.floor(t.st[0] / 2); BAG[name]--; say(`${spName(t)} foi revivido!`); return;
  }
  if (m.hp <= 0) { say('Não dá para usar agora.'); return; }
  if (it.heal) { if (m.hp >= m.st[0]) { say('O HP já está cheio!'); return; } spend(); heal(ME, it.heal); say(`Usou ${name}.`); return; }
  if (it.cure) {
    const conf = name === 'Full Heal' && m.v.conf > TIME;
    if (!it.cure.includes(m.status) && !conf) { say('Não teve efeito.'); return; }
    spend(); m.status = ''; if (conf) m.v.conf = 0; auraFX(ME, [0.6, 1, 0.8]); say(`Usou ${name}: ${spName(m)} está bem.`); return;
  }

}
function learnTM(q, slot) {
  const { name, id } = TEACH; TEACH = null;
  if (slot < 0) { q.moves.push({ id, pp: MV[id].pp }); say(`${spName(q)} aprendeu ${MV[id].name}!`, 3); }
  else { say(`${spName(q)} esqueceu ${MV[q.moves[slot].id].name} e aprendeu ${MV[id].name}!`, 3); q.moves[slot] = { id, pp: MV[id].pp }; }

function teachKey(code, n) {
  if (code === 'Escape' || n === 0) { TEACH = null; say('Deixou para depois.'); return; }
  if (!TEACH.mon) {
    const q = PARTY[n - 1]; if (!q) return;
    if (q.moves.some(x => x.id === TEACH.id)) { say(`${spName(q)} já sabe ${MV[TEACH.id].name}.`); return; }
    if (!canTM(q, TEACH.id)) { say(`${spName(q)} não consegue aprender ${MV[TEACH.id].name}.`); return; }
    if (q.moves.length < 4) learnTM(q, -1); else TEACH.mon = q;
    return;
  }
  if (n >= 1 && n <= 4 && TEACH.mon.moves[n - 1]) learnTM(TEACH.mon, n - 1);
}

function heldTick(c, m) {
  const mx = m.st[0], B = BERRIES[m.item];
  if (m.item === 'Leftovers' && m.hp < mx) heal(c, Math.max(1, Math.floor(mx / 16)));
  if (!B) return;
  const eat = () => { say(`${nm(c)} comeu a ${m.item}!`, 0); m.item = ''; };
  if (B.hp && m.hp <= mx / 2) { heal(c, B.hp < 1 ? Math.max(1, Math.floor(mx * B.hp)) : B.hp); eat(); }
  else if (B.cure && (B.cure.includes(m.status) || (B.conf && m.v.conf > TIME))) { m.status = ''; if (B.conf) m.v.conf = 0; auraFX(c, [0.6, 1, 0.8]); eat(); }
}
// pescar: de frente para a água, a vara fisga um bicho aquático que já chega lutando
const ROD_LV = [[5, 10], [15, 25], [30, 45]];
function fish(rod) {
  if (SCENE) { say('Não tem água aqui dentro.'); return; }
  if (ACTIVE.some(o => o.hostile && !o.fainted)) { say('Agora não: termine a luta primeiro.'); return; }
  if (TIME < (HERO.fishAt || 0)) return;
  const E = ctrl(), fx = Math.sin(E.yaw), fz = Math.cos(E.yaw);
  let wx = null, wz = 0;
  for (let d = 1.5; d <= 4.5; d += 0.5) if (waterAt(E.x + fx * d, E.z + fz * d)) { wx = E.x + fx * d; wz = E.z + fz * d; break; }
  if (wx === null) { say('Fique de frente para a água para pescar.'); return; }
  HERO.fishAt = TIME + 2.5;
  if (Math.random() < [0.25, 0.2, 0.15][rod]) { say('Nada mordeu a isca...'); return; }
  const [a, b] = ROD_LV[rod], far = Math.round(levelAt(wx, wz));
  const lv = Math.min(100, Math.max(a + ((Math.random() * (b - a + 1)) | 0), rod === 2 ? far : 0));
  // cada vara tem a sua tabela (dados de pesca dos jogos): a velha quase só pega Magikarp
  const pk = luckyPick(lv, rodFilter(rod), isEast(wx, wz));
  const spi = pk ? pk.spi : SPECIES.findIndex(s => s.name === 'Magikarp');
  burst([wx, 0.2, wz], [0.6, 0.8, 1], 30, 1.5, [0, 1, 2], 0.5);
  surpriseWild(spi, lv, wx, wz, 'Fisgou! Um %s saiu da água!');
}

// Lendários e quem não tem forma de ovo não botam.
const EGGS = [], EGG_STEPS = 1500, EGG_FIND = 1200;
const PREV = new Map();                              // espécie → de quem ela evolui (Pikachu → Pichu, Jynx → Smoochum…)

function eggOf(spi) {                                // a primeira forma da linha (os bebês já são a primeira forma)
  if (AP[spi].m === 'L' || SPECIES[spi].name === 'Ditto') return -1;

function hatch(e) {
  const m = makeMon(e.spi, 5); dexCatch(e.spi);

  giveBack(m, `O ovo chocou: nasceu um ${spName(m)}!`);

function daycareTick() {

  const d = D.hx === undefined ? 0 : Math.hypot(HERO.x - D.hx, HERO.z - D.hz);
  D.hx = HERO.x; D.hz = HERO.z;
  if (d >= 3) return;                                 // pulo grande (Fly, corda) não conta
  if (DAYCARE) {
    DAYCARE.steps += d; DAYCARE.egg = (DAYCARE.egg || 0) + d;
    if (DAYCARE.egg >= EGG_FIND && !DAYCARE.hasEgg && eggOf(DAYCARE.m.spi) >= 0) { DAYCARE.hasEgg = true; say('Recado da creche: apareceu um ovo! Passe na Vila Raiz para buscar.', 3); }
  }
  for (let i = EGGS.length - 1; i >= 0; i--) {
    EGGS[i].steps += d;

    else if (EGGS[i].steps >= EGG_STEPS - 150 && !EGGS[i].warned) { EGGS[i].warned = true; say('O ovo está se mexendo! Falta pouco.', 2); }
  }

  const spi = eggOf(DAYCARE.m.spi); DAYCARE.hasEgg = false; DAYCARE.egg = 0;
  EGGS.push({ spi, steps: 0 });

const ONLINE = (() => { try { const o = JSON.parse(localStorage.getItem('bosque-online')); return o && o.nome && o.token && o.server ? o : null; } catch (e) { return null; } })();
const SAVE_KEY = ONLINE ? 'bosque-ascii-save-v1@' + ONLINE.nome.toLowerCase() : 'bosque-ascii-save-v1';
let lastSave = 0;
const monToSave = m => ({ s: m.spi, l: m.lv, x: m.xp, iv: m.iv, ev: m.ev, n: m.nature, a: m.ability, it: m.item || undefined, k: m.nick || undefined, ot: m.ot || undefined, hp: m.hp, st: m.status, mv: m.moves.map(q => [q.mimic ?? q.id, q.pp]) });
function monFromSave(o) {
  const m = makeMon(o.s, o.l);
  if (o.ot) m.ot = o.ot;
  Object.assign(m, { xp: o.x, iv: o.iv, ev: o.ev, nature: o.n, status: o.st || '' });
  if (o.a) m.ability = o.a;
  if (o.it) m.item = o.it;
  if (o.k) m.nick = o.k;
  calcStats(m); m.hp = Math.max(0, Math.min(o.hp, m.st[0]));
  m.moves = o.mv.map(([id, pp]) => ({ id, pp }));
  return m;
}
function saveGame() {
  if (!ME) return;
  lastSave = TIME;
  const data = { v: 1, party: PARTY.map(monToSave), box: BOX.map(monToSave), active: PARTY.indexOf(ME.mon), balls: ballCount, bag: BAG,
    ballSel, pos: SCENE ? [...doorPos(SCENE.bl), SCENE.bl.c.yaw] : [pl.x, pl.z, pl.yaw], removed: [...WORLD.removed], caught: CREATURES.filter(c => c.caught).map(c => c.id), caughtWild: [...CAUGHT_WILD],
    day: dayTarget, money, lastPost, flags: [...FLAGS], seen: [...DEX_SEEN], dexCaught: [...DEX_CAUGHT], trainers: [...DEFEATED_TR], hof: HOF, stolen: STOLEN.map(s => ({ m: monToSave(s.m), tag: s.tag })), daycare: DAYCARE ? { m: monToSave(DAYCARE.m), steps: Math.floor(DAYCARE.steps), egg: Math.floor(DAYCARE.egg || 0), hasEgg: !!DAYCARE.hasEgg } : null,
    eggs: EGGS.map(e => [e.spi, Math.floor(e.steps)]), luck: RARE_LUCK, at: Date.now() };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* sem armazenamento: o jogo segue sem salvar */ }
  if (ONLINE) netSave(data);
}
function readSave() { try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
const SAVED = readSave();
function loadGame(d) {
  PARTY.length = 0; for (const o of d.party) PARTY.push(monFromSave(o));
  BOX.length = 0; for (const o of d.box || []) BOX.push(monFromSave(o));
  ballCount = d.balls ?? 10; for (const k in BAG) delete BAG[k]; Object.assign(BAG, d.bag || {}); ballSel = d.ballSel || 'Poké Ball';
  for (const id of d.removed || []) removeObject(id);
  for (const id of d.caught || []) { const c = CREATURES[id]; if (c) { c.caught = true; c.hidden = true; c.respawn = Infinity; } }
  for (const id of d.caughtWild || []) CAUGHT_WILD.add(id);
  [pl.x, pl.z, pl.yaw] = d.pos; pl.vx = pl.vz = 0;
  dayTarget = d.day ?? dayTarget;
  money = d.money ?? 500; lastPost = d.lastPost || null;
  FLAGS.clear(); for (const f of d.flags || []) FLAGS.add(f);
  for (const i of d.seen || []) DEX_SEEN.add(i); for (const i of d.dexCaught || []) DEX_CAUGHT.add(i); for (const m of PARTY) dexCatch(m.spi);
  for (const id of d.trainers || []) DEFEATED_TR.add(id);
  DAYCARE = d.daycare ? { m: monFromSave(d.daycare.m), steps: d.daycare.steps || 0, egg: d.daycare.egg || 0, hasEgg: !!d.daycare.hasEgg } : null;
  EGGS.length = 0; for (const [spi, steps] of d.eggs || []) EGGS.push({ spi, steps });
  RARE_LUCK = d.luck || 0;
  for (const c of TRAINERS) if (c.fixed) { c.tr.state = DEFEATED_TR.has(c.tr.id) ? 'done' : 'idle'; c.tr.mon = null; }
  leagueReset(); HOF.length = 0; HOF.push(...(d.hof || []));
  STOLEN.length = 0; for (const s of d.stolen || []) STOLEN.push({ m: monFromSave(s.m), tag: s.tag });

  spawnMe(PARTY[d.active >= 0 && PARTY[d.active] && PARTY[d.active].hp > 0 ? d.active : PARTY.findIndex(m => m.hp > 0)]);
  streamWorld();
  say(`Jogo carregado: ${PARTY.length} no time, ${BOX.length} na caixa.`, 3);
}

      { onEnd: () => { STORY.valerio2.hidden = true; STORY.valerio2.respawn = Infinity; updateActiveCreatures(); say('A Gaiola Dourada acabou! O Lugia está no fundo da lagoa e as feras voltaram ao Leste.', 4); saveGame(); } });

// ----- acampamentos e Viveiro por dentro: gaiolas que se abrem quando os guardas caem -----
function campCleared(k) { return D2(`camp${k}-a`) && D2(`camp${k}-b`) && (k !== 1 || D2('bras1')) && (k !== 3 || D2('selma')); }
const D2 = id => DEFEATED_TR.has(id);
function openCampCages(k) {
  const out = [];
  for (let i = STOLEN.length - 1; i >= 0; i--) {         // bichos levados em luta: qualquer esconderijo serve
    const s = STOLEN[i];
    if (STORY_TAGS.has(s.tag) && !(k === 0 && s.tag === 'eevee') && !(k === 2 && s.tag === 'creche')) continue;
    STOLEN.splice(i, 1);
    if (s.tag === 'eevee') { FLAGS.add('eevee:volta'); giveBack(s.m, 'O Eevee da Vó Ondina pulou no seu colo! Leve-o até ela (130 m).'); }
    else giveBack(s.m);
    out.push(spName(s.m));
  }
  if (k === 0 && FLAGS.has('eevee:roubado') && !FLAGS.has('eevee:volta') && !STOLEN.some(s => s.tag === 'eevee')) {
    const m = makeMon(spIdx('Eevee'), 8); m.ot = 'Vó Ondina'; FLAGS.add('eevee:volta'); dexCatch(m.spi); giveBack(m, 'O Eevee da Vó Ondina pulou no seu colo! Leve-o até ela (130 m).'); out.push('Eevee');
  }
  if (k === 2 && FLAGS.has('creche:dona') && !FLAGS.has('creche:salva')) { FLAGS.add('creche:salva'); out.push('a Chansey da Dona Creche (ela correu de volta para a creche)'); }
  if (roleOf(k) === 'refem' && !FLAGS.has(`refem:${k}:salvo`)) { FLAGS.add(`refem:${k}:salvo`); out.push(`o ${PERS[k].main} ${doM(k)} (ele voltou correndo para o ginásio)`); }
  if (!FLAGS.has('pagina:' + k)) { FLAGS.add('pagina:' + k); out.push(`uma página do caderno do Bento (${pageCount()}/8)`); }
  const tk = traitorK(), clue = clueCount();
  if (tk >= 0 && !FLAGS.has('pista:camp' + k) && clue < 2) {
    FLAGS.add('pista:camp' + k);
    const txt = clue === 0 ? `Bilhete amassado: "Nosso amigo mestre de ${MASTERS[tk].type} manda avisar que o caminho está livre."` : `Outro bilhete: "Entregar as caixas na ${VILLAGES[tk]}. O mestre de lá não vai olhar."`;
    say(txt, 5); out.push('um bilhete da Gaiola (veja no Diário)');
  }
  storyRefresh(); saveGame();
  return out;
}
function storyRoomTalkers(bl, ox, oz) {
  const T = [];
  if (bl.kind === 'camp') {
    const k = bl.k;
    T.push(makeTalker(CAGE_SP, 'Gaiolas', ox, oz + 4.9, Math.PI, () => {
      if (!campCleared(k)) return { pages: ['As gaiolas estão trancadas. Os Gaioleiros daqui têm a chave.'] };
      const got = openCampCages(k);
      return { pages: got.length ? ['Você abriu as gaiolas!', 'Dentro: ' + got.join(', ') + '.'] : ['As gaiolas estão vazias. A Gaiola não guarda mais nada aqui.'] };
    }, 'gaiola-camp' + k));
  }
  if (bl.kind === 'aquario') {
    [[-5.6, -8], [5.6, 0], [-5.6, 8]].forEach(([dx, dz], i) => T.push(makeTalker(CAGE_SP, 'Tanque', ox + dx, oz + dz, dx < 0 ? Math.PI / 2 : -Math.PI / 2, () => {
      if (!D2('aq-' + i)) return { pages: ['Um tanque cheio de bichos de água, com uma tranca dourada. O Gaioleiro do lado tem a chave.'] };
      if (FLAGS.has('aq:tanque' + i)) return { pages: ['O tanque está aberto e vazio. Os bichos voltaram para a lagoa.'] };
      FLAGS.add('aq:tanque' + i);
      const out = ['vários bichos de água, que nadaram de volta para a lagoa'];
      for (let j = STOLEN.length - 1; j >= 0; j--) { const s = STOLEN[j]; if (STORY_TAGS.has(s.tag)) continue; STOLEN.splice(j, 1); giveBack(s.m); out.push(spName(s.m)); }
      saveGame();
      return { pages: ['Você abriu o tanque!', 'Saíram: ' + out.join(', ') + '.'] };
    }, 'tanque' + i)));
  }
  if (bl.kind === 'viveiro') {
    [[-6.2, -10], [6.2, -2], [-6.2, 6]].forEach(([dx, dz], i) => T.push(makeTalker(CAGE_SP, 'Cúpula de vidro', ox + dx, oz + dz, dx < 0 ? Math.PI / 2 : -Math.PI / 2, () => {
      if (!D2('bras2') && !FLAGS.has('disfarce')) return { pages: ['Dezenas de bichos atrás do vidro. A trava só abre com a chave do Brás.'] };
      if (FLAGS.has('viv:cupula' + i)) return { pages: ['Esta cúpula já está aberta. Os bichos voltaram para o bosque.'] };
      FLAGS.add('viv:cupula' + i); rumor('mewtwo', 'viveiro');
      const out = ['dezenas de bichos, que correram de volta para a mata'];
      for (let j = STOLEN.length - 1; j >= 0; j--) { const s = STOLEN[j]; if (s.tag === 'ravi') continue; STOLEN.splice(j, 1); giveBack(s.m); out.push(spName(s.m)); }
      if (i === 1 && FLAGS.has('ravi:roubado') && !FLAGS.has('ravi:recuperado')) { FLAGS.add('ravi:recuperado'); out.push('o inicial do Ravi (ele vai ficar feliz)'); }
      const sk = MASTERS.findIndex((M, k) => roleOf(k) === 'sumido');
      if (i === 2 && sk >= 0 && !FLAGS.has(`sumido:${sk}:achado`)) { FLAGS.add(`sumido:${sk}:achado`); FLAGS.add('aliado:' + sk); out.push(`${oM(sk)} ${MASTERS[sk].name}, pres${oM(sk)} numa cúpula! ${eleM(sk)[0].toUpperCase() + eleM(sk).slice(1)} saiu correndo para o ginásio`); }
      storyRefresh(); saveGame();
      return { pages: ['Você abriu a cúpula de vidro!', 'Saíram: ' + out.join(', ') + '.'] };
    }, 'cupula' + i)));
    // aliados: cada mestre aliado (e o Ravi, se for amigo) segura um Gaioleiro e cura o time uma vez
    const helpers = MASTERS.map((M, k) => k).filter(isAlly).map(k => MASTERS[k].name);
    if (FLAGS.has('ravi:ajudou') || FLAGS.has('ravi:voltou')) helpers.unshift('Rival Ravi');
    helpers.slice(0, 4).forEach((name, i) => {
      const g = STORY['viv-' + i]; if (g && g.tr.state !== 'done') g.tr.state = 'done';
      T.push(makeTalker(i % 5, name, ox + (i % 2 ? 3 : -3) + (i % 2 ? -1.4 : 1.4), [-14, -6, 2, 10][i] - 0.8, Math.PI, () => {
        const cur = !FLAGS.has('viv:cura:' + i);
        if (cur) { FLAGS.add('viv:cura:' + i); for (const q of PARTY) { q.hp = q.st[0]; q.status = ''; for (const x of q.moves) x.pp = MV[x.id].pp; } say('Seu time foi curado!', 2); }
        return { pages: [cur ? 'Pode deixar esse Gaioleiro comigo! E tome fôlego: curei o seu time.' : 'Vai lá! O Curador está no fundo do salão.'] };
      }, 'ajuda' + i));
    });
    if (FLAGS.has('disfarce')) for (let i = 0; i < 4; i++) { const g = STORY['viv-' + i]; if (g && g.tr.state === 'idle') g.tr.state = 'done'; }
  }
  return T;
}

// ----- Ravi: falas e escolhas por parada -----
function rivalHi(i) {
  const R = RIVAL_STOPS[i];
  if (i === 2) {
    if (FLAGS.has('ravi:ajudou')) return ['E aí, parceiro! Bora ver quem treinou mais? Depois a gente fica de olho nessa tal de Feira da Névoa.'];
    if (FLAGS.has('ravi:gaiola')) { return ['...Não me olha assim. A Gaiola prometeu devolver meu bicho se eu trabalhar para eles.', 'Olha o meu boné novo. Amarelo. Combina comigo, né? ...Né?', 'Vamos lutar!']; }
  }
  if (i === 3 && FLAGS.has('ravi:gaiola') && !FLAGS.has('ravi:voltou')) return ['A Gaiola me mandou te parar. Nada pessoal... é que eu preciso muito do meu bicho de volta.'];
  if (i === 4 && FLAGS.has('ravi:recuperado')) return ['Meu bicho voltou para mim! E foi graças a você.', 'Agora a gente luta de verdade, sem Gaiola, sem nada. Só nós dois. Bora!'];
  return [R.hi];
}
function rivalTeam(i) {
  const R = RIVAL_STOPS[i];
  if (i >= 2 && FLAGS.has('ravi:roubado') && !FLAGS.has('ravi:ajudou')) FLAGS.add('ravi:gaiola');   // sem ajuda, ele entra na Gaiola para tentar recuperar o bicho
  const team = R.extra.map(([n, d]) => { const lv = Math.max(2, R.lv + d); return { spi: evolveTo(spIdx(n), lv), lv }; });
  if (FLAGS.has('ravi:gaiola') && !FLAGS.has('ravi:voltou')) team.push(...gaiolaTeam('ravi' + i, R.lv - 2, 2));
  if (!(FLAGS.has('ravi:roubado') && !FLAGS.has('ravi:recuperado'))) team.push({ spi: evolveTo(rivalStarter(), R.lv), lv: R.lv });
  return team;
}
function rivalAfter(c) {
  const i = c.rival, tr = c.tr, R = 'Rival Ravi';
  if (i === 1 && !FLAGS.has('ravi:roubado')) {
    FLAGS.add('ravi:roubado');
    const st = SPECIES[rivalStarter()].name;
    talkDialog(R, [tr.after, `(Você ganhou $${tr.reward}.)`, `Ei! EI! Aqueles dois de boné amarelo pegaram o meu ${st} numa rede!`], { choices: [
      { t: 'Eu te ajudo!', fn: () => { FLAGS.add('ravi:ajudando'); storyRefresh(); for (const id of ['rl-a', 'rl-b']) { const g = STORY[id]; g.tr.state = 'approach'; } talkDialog(R, ['Valeu! Eles estão ali, ó!']); } },
      { t: 'Foi mal, estou com pressa', fn: () => { FLAGS.add('ravi:sozinho'); talkDialog(R, ['...Tá. Eu me viro sozinho. Como sempre.']); saveGame(); } }] });
    return;
  }
  if (i === 3) {
    if (FLAGS.has('ravi:gaiola') && !FLAGS.has('ravi:voltou')) {
      talkDialog(R, [tr.after, `(Você ganhou $${tr.reward}.)`, 'A Gaiola nunca vai devolver meu bicho, né? Eu sou um bobo.'], { choices: [
        { t: 'Larga a Gaiola. Eu te ajudo a recuperar', fn: () => { FLAGS.add('ravi:voltou'); talkDialog(R, ['...Combinado. O boné amarelo nem combinava comigo mesmo.', 'Dizem que os bichos roubados ficam no Viveiro, uns 700 m para trás, à direita da trilha. Eu vou com você!']); saveGame(); } },
        { t: 'Você que sabe', fn: () => talkDialog(R, ['...Tá.']) }] });
      return;
    }
    if (FLAGS.has('ravi:ajudou') && !FLAGS.has('chave')) {
      FLAGS.add('chave');
      talkDialog(R, [tr.after, `(Você ganhou $${tr.reward}.)`, 'Ah! Peguei isto de um Gaioleiro distraído: a chave do Viveiro. Fica com você, eu vou junto!'], { onEnd: () => { giveItem('Chave do Viveiro'); saveGame(); } });
      return;
    }
  }
  talkDialog(R, [tr.after, `(Você ganhou $${tr.reward}.)`]);
}

// joystick (esquerda) e arrastar para girar a câmera (resto da tela)

// ---------- jogar com amigos ----------
// Cada um joga o próprio jogo (time, insígnias, mochila); o servidor do PC (servidor/servidor.mjs) só repassa onde cada um
// está, os duelos entre jogadores e quais selvagens estão em luta, e guarda o jogo salvo de cada conta. Os amigos aparecem
// como treinador + bicho que está fora, desenhados 0,1 s no passado (interpolação entre as duas últimas posições recebidas).
// Selvagem em luta fica reservado para quem começou: para os outros ele mostra "em luta com Fulano" e não leva golpe.
// Duelo é amistoso: no fim cada time volta como estava (vida, condição e PP), sem experiência nem dinheiro. Cada lado manda
// nos próprios números: quem recebe o golpe calcula o dano no próprio bicho e conta a vida dele para o outro.
// Sem servidor o jogo segue salvando só no navegador e tenta de novo; ao voltar, manda o jogo salvo mais novo.
const NET = { ws: null, on: false, nome: ONLINE ? ONLINE.nome : '', peers: new Map(), reservas: {}, pend: null, sentSave: 0, saveAt: -99,
  posAt: 0, resAt: 0, resSent: '', tries: 0, retryAt: 0, duel: null, msg: '' };
const NET_DELAY = 0.1, NET_SAVE_EVERY = 30;
let netSeq = 0;

const netSend = o => { if (NET.ws && NET.ws.readyState === 1) { NET.ws.send(JSON.stringify(o)); return true; } return false; };
function netWsUrl(server) { const u = new URL(server); u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:'; u.pathname = '/ws'; u.search = u.hash = ''; return u.href; }
function netInfo() { return ONLINE ? (NET.on ? ` · online: ${NET.nome}${NET.peers.size ? ` + ${NET.peers.size}` : ''}` : ' · sem servidor (salvando só aqui)') : ''; }

// conexão de quem já entrou (a sessão fica no navegador): religa sozinha, de 2 em 2 s até 30 s
function netConnect() {
  if (!ONLINE || NET.ws) return;
  let ws; try { ws = new WebSocket(netWsUrl(ONLINE.server)); } catch (e) { NET.retryAt = performance.now() + 30000; return; }
  NET.ws = ws;
  ws.onopen = () => ws.send(JSON.stringify({ t: 'retomar', nome: ONLINE.nome, token: ONLINE.token }));
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (er) { return; } netOn(m); };
  ws.onclose = () => {
    if (NET.ws !== ws) return;
    if (NET.on) say('Sem conexão com o servidor: o jogo segue salvando aqui.', 2);
    NET.ws = null; NET.on = false; netClearPeers();
    if (NET.duel) netDuelEnd({ motivo: 'caiu' });
    NET.retryAt = performance.now() + Math.min(30000, 2000 * 2 ** NET.tries++);
  };
}
function netOn(m) {
  switch (m.t) {
    case 'ok': {
      NET.on = true; NET.tries = 0; NET.nome = m.nome;
      const srv = m.save, loc = readSave();
      // jogo do servidor mais novo (jogou em outro aparelho) e ainda na tela inicial: usa ele
      if (srv && !HERO && (!loc || (srv.at || 0) > (loc.at || 0) + 2000) && sessionStorage.getItem('bosque-sync') !== String(srv.at)) {
        try { sessionStorage.setItem('bosque-sync', String(srv.at)); localStorage.setItem(SAVE_KEY, JSON.stringify(srv)); location.reload(); return; } catch (e) { /* sem armazenamento */ }
      }
      if (loc && (!srv || (loc.at || 0) > (srv.at || 0))) { NET.pend = loc; NET.saveAt = -99; }
      say(m.outros.length ? `Online! Também estão aqui: ${m.outros.join(', ')}.` : 'Online! Ninguém mais no bosque agora.', 2);
      return;
    }
    case 'erro':
      if (m.sair) { try { localStorage.removeItem('bosque-online'); } catch (e) { /* nada */ } say(m.msg + ' (recarregue a página)', 3); NET.ws && NET.ws.close(); return; }
      say(m.msg, 2); return;
    case 'aviso': say(m.msg, 2); return;
    case 'salvo': NET.sentSave = m.at; return;
    case 'entrou': say(`${m.n} entrou no bosque.`, 1); return;
    case 'saiu': netDropPeer(m.n); say(`${m.n} saiu do bosque.`, 1); return;
    case 'pos': netPos(m); return;
    case 'reservas': NET.reservas = m.r || {}; return;
    case 'desafio':
      if (NET.duel || DIALOG || !HERO) { netSend({ t: 'resposta', para: m.de, sim: false }); return; }
      talkDialog(m.de, [`${m.de} desafia você para um duelo amistoso! Ninguém perde bicho, dinheiro nem experiência: no fim os dois times voltam como estavam.`],
        { choices: [{ t: 'Aceitar', fn: () => netSend({ t: 'resposta', para: m.de, sim: true }) }, { t: 'Recusar', fn: () => netSend({ t: 'resposta', para: m.de, sim: false }) }] });
      return;
    case 'duelo': netDuelStart(m.com); return;
    case 'duelo-mon': netDuelMon(m); return;
    case 'golpe': netDuelMove(m.mv); return;
    case 'fim': netDuelEnd(m); return;
  }
}

// ---------- o jogo salvo vai ao servidor de 30 em 30 s (e ao fechar a página) ----------
function netSave(data) { NET.pend = data; }
function netFlush() { if (NET.on && NET.pend && NET.pend.at !== NET.sentSave && netSend({ t: 'salvar', save: NET.pend })) NET.saveAt = TIME; }
addEventListener('pagehide', netFlush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (HERO) saveGame(); netFlush(); } });

// ---------- os outros jogadores no mundo ----------
function netPeer(n) {
  let P = NET.peers.get(n);
  if (!P) NET.peers.set(n, P = { n, buf: [], hero: null, mon: null, last: 0, sc: null, dv: false });
  return P;
}
function netPos(m) {
  const P = netPeer(m.n), now = performance.now() / 1000;
  P.buf.push({ t: now, h: m.h, m: m.m }); if (P.buf.length > 12) P.buf.shift();
  Object.assign(P, { last: now, sc: m.sc, dv: m.dv, f: m.f });
  if (!P.hero) {
    let hsh = 0; for (const ch of P.n) hsh = (hsh * 31 + ch.charCodeAt(0)) | 0;
    const c = P.hero = makeCreature(HUMAN_SP[Math.abs(hsh) % HUMAN_SP.length], 50000 + netSeq++, m.h[0], m.h[1], m.h[2]);
    Object.assign(c, { npc: 'net', net: P, name: P.n, hidden: true });
  }
  const D = NET.duel;
  if (D && D.com === P.n && D.foe && m.d) {           // a vida do bicho dele é ele quem conta
    const f = D.foe; f.mon.hp = Math.max(0, Math.min(f.mon.st[0], m.d[0])); f.mon.status = m.st || '';
    if (m.d[0] <= 0 && !f.fainted) { f.netKO = true; faint(f); }
  }
  if (!(D && D.com === P.n)) {                        // fora de duelo: o bicho dele é só um boneco
    const spi = m.m ? m.m[0] : -1;
    if (P.mon && (spi < 0 || P.mon.spi !== spi)) { netRemove(P.mon); P.mon = null; }
    if (spi >= 0 && !P.mon && SPECIES[spi]) {
      const c = P.mon = makeCreature(SPECIES[spi], 50000 + netSeq++, m.m[1], m.m[2], m.m[3]);
      Object.assign(c, { npc: 'net', net: P, spi, name: `${SPECIES[spi].name} de ${P.n}`, wildLv: m.m[5], hidden: true });
    }
  }
}
function netRemove(c) { if (!c) return; c.hidden = true; const i = ACTIVE.indexOf(c); if (i >= 0) updateActiveCreatures(); }
function netDropPeer(n) { const P = NET.peers.get(n); if (!P) return; netRemove(P.hero); netRemove(P.mon); NET.peers.delete(n); }
function netClearPeers() { for (const n of [...NET.peers.keys()]) netDropPeer(n); }
// entra na lista de ativos (desenho e colisão) quem está na mesma cena, no mesmo "fundo" (mergulho) e perto
function netActive(next) {
  for (const P of NET.peers.values()) for (const c of [P.hero, P.mon]) if (c && !c.hidden && Math.hypot(c.x - pl.x, c.z - pl.z) < 70) next.push(c);
}
function netSample(P, which, t) {                     // posição interpolada no tempo t (segundos locais)
  const b = P.buf; let a = null, z = null;
  for (let i = b.length - 1; i >= 0; i--) { const v = which === 'h' ? b[i].h : b[i].m && b[i].m.length > 3 ? b[i].m.slice(1) : null; if (!v) continue; if (b[i].t <= t) { a = { t: b[i].t, v }; break; } z = { t: b[i].t, v }; }
  if (!a) return z && z.v; if (!z) return a.v;
  const k = (t - a.t) / Math.max(1e-3, z.t - a.t);
  let dy = z.v[2] - a.v[2]; dy -= TAU * Math.round(dy / TAU);
  return [a.v[0] + (z.v[0] - a.v[0]) * k, a.v[1] + (z.v[1] - a.v[1]) * k, a.v[2] + dy * k, a.v[3]];
}
function netDrive(c, v, dt) {
  if (!v || c.dash || c.fainted) { if (!c.fainted) animate(c); return; }
  const x0 = c.x, z0 = c.z;
  c.x = v[0]; c.z = v[1];
  c.yaw = v[2];
  const moved = Math.hypot(c.x - x0, c.z - z0);
  c.phase += Math.min(moved, 2) / (c.sp.stride * c.scale) * Math.PI;
  c.move += (Math.min(1, moved / Math.max(dt, 1e-4) / 0.6) - c.move) * Math.min(1, dt * 8);
  animate(c);
}
function netNear() {                                  // treinador de outro jogador bem na frente (E fala com ele)
  const E = ctrl(); if (!E) return null;
  let best = null, bd = 3;
  for (const P of NET.peers.values()) { const c = P.hero; if (c && !c.hidden) { const d = Math.hypot(c.x - E.x, c.z - E.z); if (d < bd) { bd = d; best = P; } } }

}
function netTalk(P) {
  if (NET.duel && NET.duel.com === P.n) {
    talkDialog(P.n, ['Desistir do duelo?'], { choices: [{ t: 'Desistir', fn: () => { netSend({ t: 'fim', motivo: 'desisto' }); } }, { t: 'Continuar lutando', fn: () => {} }] });
    return;
  }
  if (NET.duel) { say('Termine o duelo primeiro.', 2); return; }
  talkDialog(P.n, [`Desafiar ${P.n} para um duelo amistoso? (no fim os dois times voltam como estavam)`],
    { choices: [{ t: 'Desafiar', fn: () => { netSend({ t: 'desafio', para: P.n }); say(`Desafio enviado a ${P.n}...`, 2); } }, { t: 'Agora não', fn: () => {} }] });
}

// ---------- duelo entre jogadores ----------
function netDuelStart(com) {
  NET.duel = { com, foe: null, sent: null, lost: false, snap: PARTY.map(m => ({ m, hp: m.hp, st: m.status, pp: m.moves.map(x => x.pp) })) };
  const P = NET.peers.get(com); if (P && P.mon) { netRemove(P.mon); P.mon = null; }
  say(`Duelo com ${com}! ${ME.out ? 'Lute!' : TOUCH_UI ? 'Toque em Lançar para soltar seu bicho.' : 'Lance seu bicho (Q).'}`, 3);
}
function netDuelMon(m) {                              // o bicho que ele lançou: boneco com os números dele, hostil só para mim
  const D = NET.duel; if (!D || !m.mon || !SPECIES[m.mon.s]) return;
  const P = netPeer(D.com);
  if (D.foe) { netRemove(D.foe); D.foe.hostile = false; }
  const c = makeCreature(SPECIES[m.mon.s], 50000 + netSeq++, m.x, m.z, m.yaw);
  let mon; try { mon = monFromSave(m.mon); } catch (e) { return; }
  Object.assign(c, { net: P, pvp: D.com, spi: m.mon.s, mon, hostile: true, wait: 0 });
  mon.part = new Set([ME.mon]); mon.v.fakeout = false;
  P.mon = D.foe = c;
  if (ME && ME.out) { entryAbility(ME, c); entryAbility(c, ME); }
  updateActiveCreatures();
  say(`${D.com} lançou ${spName(mon)} (Nv ${mon.lv})!`, 2);
}
function netDuelMove(id) {                            // ele usou um golpe: repete aqui, do boneco dele contra o meu bicho
  const D = NET.duel, f = D && D.foe, mv = MV[id];
  if (!f || f.fainted || f.hidden || !mv || !ME || !ME.out) return;
  f.yaw = Math.atan2(ME.x - f.x, ME.z - f.z); f.mon.v.last = id;
  say(`${nm(f)} usou ${mv.name}!`, 0);
  sigilFX(f, mv); deliver(f, mv, ME);
}
function netMoveOut(mv) { if (NET.duel && NET.duel.foe) netSend({ t: 'golpe', mv: mv.id }); }
function netDuelLost() {                              // todo o meu time caiu: perdi (o servidor avisa os dois)
  const D = NET.duel; if (!D || D.lost) return;
  D.lost = true; netSend({ t: 'fim', motivo: 'perdi' });
  ME.fainted = 0; ME.yoff = 0; recall(false);
}
function netDuelEnd(m) {
  const D = NET.duel; if (!D) return;
  NET.duel = null;
  if (D.foe) { D.foe.hostile = false; netRemove(D.foe); const P = NET.peers.get(D.com); if (P && P.mon === D.foe) P.mon = null; }
  for (const s of D.snap) { s.m.hp = s.hp; s.m.status = s.st; s.m.v = freshVolatile(); s.m.moves.forEach((x, i) => { if (s.pp[i] !== undefined) x.pp = s.pp[i]; }); }
  if (ME) { restoreForm(ME); ME.fainted = 0; ME.yoff = 0; if (ME.mon.hp <= 0) setLead(PARTY.find(q => q.hp > 0) || PARTY[0]); }
  const t = m.motivo === 'saiu' ? `${D.com} saiu do jogo: duelo encerrado.` : m.motivo === 'caiu' ? 'A conexão caiu: duelo encerrado.'
    : m.vencedor === NET.nome ? (m.motivo === 'desistiu' ? `${D.com} desistiu. Você venceu o duelo!` : `Você venceu o duelo com ${D.com}!`)
    : m.motivo === 'desistiu' ? `Você desistiu do duelo com ${D.com}.` : `${D.com} venceu o duelo.`;

// ---------- a cada quadro ----------
function netTick(dt) {
  if (!ONLINE) return;
  const now = performance.now();
  if (!NET.ws && now > NET.retryAt) netConnect();
  // os outros: aparece quem está na mesma cena, no mesmo fundo e com notícia recente
  const t = now / 1000 - NET_DELAY, sc = SCENE ? SCENE.bl.id : null;
  let changed = false;
  for (const P of NET.peers.values()) {
    const show = HERO && now / 1000 - P.last < 5 && P.sc === sc && P.dv === !!DIVE;
    const h = netSample(P, 'h', t), mm = netSample(P, 'm', t);
    for (const c of [P.hero, P.mon]) {
      if (!c) continue;
      const vis = show && !(c.pvp && c.netKO && (!c.fainted || TIME - c.fainted > 1.6)) && !(c === P.mon && !c.pvp && !mm);
      if (c.hidden === vis) { c.hidden = !vis; changed = true; }
      if (vis && c.active) netDrive(c, c === P.hero ? h : mm, dt);
      else if (vis) { const v = c === P.hero ? h : mm; if (v) { c.x = v[0]; c.z = v[1]; c.yaw = v[2]; } }
    }
  }
  if (changed) updateActiveCreatures();
  if (!NET.on || !HERO) return;
  // a minha posição, 10 vezes por segundo
  if (now - NET.posAt > 100) {
    NET.posAt = now;
    const out = ME && ME.out && !ME.fainted, D = NET.duel;
    netSend({ t: 'pos', h: [HERO.x, HERO.z, HERO.yaw, HERO.move], m: out ? [ME.mon.spi, ME.x, ME.z, ME.yaw, ME.move, ME.mon.lv] : 0, sc, dv: !!DIVE,
      f: ACTIVE.some(o => o.hostile && !o.fainted), d: D && ME ? [ME.mon.hp, ME.mon.st[0], 0] : null, st: D && ME ? ME.mon.status : '' });
    if (D && out && D.sent !== ME.mon) { D.sent = ME.mon; netSend({ t: 'duelo-mon', mon: monToSave(ME.mon), x: ME.x, z: ME.z, yaw: ME.yaw }); }
    if (D && !out) D.sent = null;
  }
  // selvagens em luta: os meus vão para o servidor; os dos outros ficam marcados aqui
  if (now - NET.resAt > 500) {
    NET.resAt = now;
    const mine = ACTIVE.filter(c => c.wildId && c.hostile && !c.fainted && !c.reservedBy).map(c => c.wildId).sort().join('|');
    if (mine !== NET.resSent) { NET.resSent = mine; netSend({ t: 'reservar', ids: mine ? mine.split('|') : [] }); }
    for (const c of ACTIVE) if (c.wildId) {
      const r = NET.reservas[c.wildId], by = r && r !== NET.nome ? r : null;
      if (by && c.hostile && !c.reservedBy) { endFight(c); say(`${c.name} já está em luta com ${by}.`, 2); }
      c.reservedBy = by;
    }
  }
  if (TIME - NET.saveAt >= NET_SAVE_EVERY) { NET.saveAt = TIME; netFlush(); }
}

    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (er) { return; }
      if (m.t === 'erro') { clearTimeout(to); msg(m.msg); ws.close(); return; }
      if (m.t !== 'ok') return;
      clearTimeout(to); ws.onclose = null; ws.close();
      try {
        const key = 'bosque-ascii-save-v1@' + m.nome.toLowerCase(), cur = JSON.parse(localStorage.getItem(key) || 'null');
        const solo = JSON.parse(localStorage.getItem('bosque-ascii-save-v1') || 'null');
        const best = [m.save, cur, !m.save && !cur ? solo : null].filter(Boolean).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
        if (best) localStorage.setItem(key, JSON.stringify(best));   // conta nova num navegador com jogo: leva o jogo junto
        localStorage.setItem('bosque-online', JSON.stringify({ server, nome: m.nome, token: m.token }));
        localStorage.setItem('bosque-servidor', server);
      } catch (er) { msg('Este navegador não deixa guardar dados.'); return; }
      location.reload();
    };
  };
}

// ---------- laço ----------
let last = performance.now();
function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = now < HITSTOP_END ? raw * JUICE_P.stopScale : raw; TIME += dt;
  fps = fps * 0.95 + (1 / Math.max(raw, 1e-3)) * 0.05;
  dayK += Math.max(-dt * 0.4, Math.min(dt * 0.4, dayTarget - dayK));
  updatePal(dayK);
  if (DIVE && !SCENE) Object.assign(PAL, { fr: 0.02, fg: 0.1, fb: 0.22, fogD: 0.11 });   // debaixo d'água: névoa azul
  if (SCENE && SCENE.dark) Object.assign(PAL, { ar: 0.015, ag: 0.015, ab: 0.025, fr: 0, fg: 0, fb: 0, fogD: 0.09 });   // gruta: só a lanterna ilumina
  else if (!SCENE && weather() === 'rain') { PAL.ar *= 0.7; PAL.ag *= 0.7; PAL.ab *= 0.75; PAL.fogD *= 1.6; }   // chuva escurece e fecha a vista
  updatePlayer(dt);
  streamWorld();
  updateParticles(dt);
  updateCreatures(dt);
  netTick(dt);
  if (HERO) updateBattle(dt);
  updateEmbers(dt);
  updateAudio();
  render();
  requestAnimationFrame(frame);
}
// para inspecionar pelo console: WORLD.objectsNear(pl.x, pl.z, 10), WORLD.removeObject(id), WORLD.active()
Object.assign(WORLD, { objectsNear, removeObject, restoreObject, creatures: CREATURES, active: () => ACTIVE, party: PARTY, me: () => ME });
streamWorld();
initGL();
setup();
updatePal(0);
requestAnimationFrame(frame);
</script>
